// The unified job model: simulations, optimizations, workflows.
syntax = "proto3";
package resonant.v1;

import "google/protobuf/timestamp.proto";
import "resonant/v1/common/errors.proto";
import "resonant/v1/common/identifiers.proto";

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_CREATED = 1;
  JOB_STATE_QUEUED = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_CANCELLING = 4;
  JOB_STATE_CANCELLED = 5;
  JOB_STATE_COMPLETED = 6;
  JOB_STATE_FAILED = 7;
}

message Job {
  string job_id = 1;
  string job_type = 2;          // "acoustic.field", "optimization", "workflow", or "application" (started by the GUI)
  string display_name = 3;
  JobState state = 4;
  double progress_fraction = 5; // 0..1
  string phase = 6;             // what it is doing now
  google.protobuf.Timestamp start_time = 7;
  double elapsed_seconds = 8;
  google.protobuf.Timestamp completion_time = 9;
  Error error = 10;             // for FAILED / CANCELLED
  repeated ResourceRef results = 11;
  bool cancellable = 12;
  string session_id = 13;       // who started it (empty: the application itself)
}
