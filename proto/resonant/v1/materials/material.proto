syntax = "proto3";
package resonant.v1;

enum MaterialProvenance {
  MATERIAL_PROVENANCE_UNSPECIFIED = 0;
  MATERIAL_PROVENANCE_MEASURED = 1;      // measured on the actual material
  MATERIAL_PROVENANCE_MANUFACTURER = 2;  // the manufacturer's data sheet
  MATERIAL_PROVENANCE_LITERATURE = 3;    // derived from published values
  MATERIAL_PROVENANCE_THEORETICAL = 4;   // a model or estimate
  MATERIAL_PROVENANCE_ILLUSTRATIVE = 5;  // for demonstration only
  MATERIAL_PROVENANCE_HOMOGENIZED = 6;   // derived from an organized structure by an effective-medium analysis
  MATERIAL_PROVENANCE_COMPUTED = 7;      // calculated from a lower-scale representation (see derivation_id)
  MATERIAL_PROVENANCE_DATABASE = 8;      // from a materials database
  MATERIAL_PROVENANCE_FITTED = 9;        // fitted or calibrated to data
  MATERIAL_PROVENANCE_SURROGATE = 10;    // a surrogate model's prediction
}

// One property of one physics domain. Values are SI (kg/m^3, m/s, Pa, S/m,
// relative permittivity ...); the key names the quantity.
message MaterialProperty {
  string domain = 1;          // "acoustic", "mechanical", "electromagnetic", "thermal", "optical"
  string key = 2;             // "density", "sound_speed", "youngs_modulus", ...
  double value_si = 3;
  reserved 4;
  MaterialProvenance provenance = 5;
  string source = 6;          // citation, data sheet, note
  string derivation_id = 7;   // the multiscale derivation that produced the value (empty: none)
  bool has_uncertainty = 8;
  double uncertainty = 9;     // standard uncertainty in SI units, when has_uncertainty
}

message Material {
  string material_id = 1;
  string name = 2;
  string description = 3;
  repeated string domains = 4;
  repeated MaterialProperty properties = 5;
  // The material in the project file's JSON form (frequency tables, validity ranges).
  string material_json = 6;
}
